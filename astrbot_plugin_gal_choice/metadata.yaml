name: astrbot_plugin_gal_choice
display_name: GalGame 选项
short_desc: 进入 GalGame 模式，台词选项成图，支持自定义立绘/背景与语音
desc: >-
  一键进入 GalGame 模式：模型每轮只输出「表情 + 台词 + 2~4 个选项」，
  插件把它渲染成一张 1280×720 的 GalGame 界面图，台词同时可配 FishAudio 等 TTS 语音。
  用户回字母 / 数字 / 选项原文继续，也可以回 0 或直接说话自由输入；选项会带进下一轮，
  形成连续剧情。提供 /gal start、/gal stop、/gal status、/gal model、/gal voice、
  /gal reset 等指令，支持按会话指定模型、开关语音、保持背景连续。
  自带 WebUI 资源工作台：上传角色立绘和表情差分、上传背景、可视化调整立绘位置/高度/宽度，
  保存后立即预览；资源保存在 plugin_data，更新插件不会丢。
  本插件基于 bvzrays/astrbot_plugin_qqgal 改动，按 AGPL-3.0 发布。
version: 0.3.0
author: iv小白龙
repo: https://github.com/ggxiaobailong-blip/astrbot_plugin_gal_choice
social_link: https://github.com/ggxiaobailong-blip
astrbot_version: ">=4.21,<5"
support_platforms:
  - aiocqhttp
